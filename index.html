<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />

    <!-- ── SEO ─────────────────────────────────────────────────────────── -->
    <title>MacroStack — Nutrition Coaching &amp; Macro Tracking App</title>
    <meta name="description" content="MacroStack is the nutrition OS for serious athletes and the coaches who guide them. Precision macro tracking, barcode scanning, AI food data, coach-built meal plans, and real-time coaching — free to start." />
    <meta name="keywords" content="macro tracker, nutrition coaching, macro counting app, meal plan app, calorie tracker, barcode food scanner, online nutrition coach, macros, fitness nutrition, body recomposition" />
    <meta name="author" content="MacroStack" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.getmacrostack.com/" />

    <!-- Open Graph (Facebook, iMessage, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MacroStack" />
    <meta property="og:title" content="MacroStack — Nutrition Coaching &amp; Macro Tracking" />
    <meta property="og:description" content="The nutrition OS for serious athletes and the coaches who guide them. Track macros, scan barcodes, follow coach-built meal plans, and check in weekly." />
    <meta property="og:url" content="https://www.getmacrostack.com/" />
    <meta property="og:image" content="https://www.getmacrostack.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MacroStack — nutrition coaching and macro tracking app" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MacroStack — Nutrition Coaching &amp; Macro Tracking" />
    <meta name="twitter:description" content="The nutrition OS for serious athletes and the coaches who guide them. Track macros, scan barcodes, follow coach-built meal plans, and check in weekly." />
    <meta name="twitter:image" content="https://www.getmacrostack.com/og-image.png" />

    <!-- Structured data — tells Google this is an app with a free tier -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MacroStack",
      "operatingSystem": "Web, iOS, Android",
      "applicationCategory": "HealthApplication",
      "description": "Precision macro tracking with a 15,000+ food database, barcode scanning, weight trends, and built-in nutrition coaching — message your coach, submit weekly check-ins, and follow coach-built meal plans.",
      "url": "https://www.getmacrostack.com/",
      "image": "https://www.getmacrostack.com/og-image.png",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Free to start" }
    }
    </script>

    <!-- PWA / Web App -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#08090F" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MacroStack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  <script>
    // Apply the persisted theme before first paint so there's no flash.
    // Dark (ocean-dark) is the default when nothing is stored.
    try {
      var s = JSON.parse(localStorage.getItem('macrostack-ui-dark2') || '{}')
      var t = (s && s.state && s.state.theme) || 'ocean-dark'
      document.documentElement.classList.add(t)
    } catch(e) {
      document.documentElement.classList.add('ocean-dark')
    }
  </script>

  <!-- Structured data — helps search engines understand the app -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "MacroStack",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Web, iOS, Android",
    "url": "https://www.getmacrostack.com/",
    "description": "The nutrition OS for serious athletes and the coaches who guide them. Precision macro tracking, barcode scanning, AI food data, coach-built meal plans, and real-time coaching.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD",
      "description": "Free to start"
    }
  }
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
