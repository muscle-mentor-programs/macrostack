<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fv-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#EAF2FA"/>
      <stop offset="100%" stop-color="#C8DAF0"/>
    </linearGradient>
    <linearGradient id="fv-mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#C0D4E8"/>
      <stop offset="100%" stop-color="#A4BCDA"/>
    </linearGradient>
    <linearGradient id="fv-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#A4BCDA"/>
      <stop offset="100%" stop-color="#8AAACB"/>
    </linearGradient>
    <filter id="fv-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0D1F44" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Back card -->
  <rect x="29" y="29" width="52" height="52" rx="10" ry="10"
        fill="url(#fv-back)"
        transform="rotate(45 55 55)"/>

  <!-- Middle card -->
  <rect x="24" y="24" width="52" height="52" rx="10" ry="10"
        fill="url(#fv-mid)"
        transform="rotate(45 50 50)"/>

  <!-- Front card -->
  <rect x="19" y="19" width="52" height="52" rx="10" ry="10"
        fill="url(#fv-front)"
        stroke="#B8CEE6" stroke-width="0.6"
        filter="url(#fv-shadow)"
        transform="rotate(45 45 45)"/>

  <!-- MS text — slightly larger for favicon legibility -->
  <text x="45" y="50"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Arial Black', Impact, Arial, sans-serif"
        font-weight="900" font-size="27" letter-spacing="-0.5">
    <tspan fill="#3060A0">M</tspan><tspan fill="#1A3D78">S</tspan>
  </text>
</svg>
